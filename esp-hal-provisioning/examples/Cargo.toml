[package]
name         = "esp-hal-provisioning-examples"
version      = "0.0.0"
edition      = "2024"
rust-version = "1.88"
publish      = false

[[bin]]
name              = "cli_wifi"
required-features = ["wifi"]

[[bin]]
name = "cli_custom"

[[bin]]
name              = "sd_wifi"
required-features = ["wifi", "sdcard"]

[[bin]]
name              = "sdmmc_custom"
required-features = ["sdmmc"]

[[bin]]
name              = "ble_wifi"
required-features = ["coex"]

[[bin]]
name              = "ble_custom"
required-features = ["ble"]

[dependencies]
esp-hal-provisioning = { path = "..", default-features = false, features = ["cli", "esp-flash", "log-04"] }

esp-alloc              = "0.11.0"
esp-backtrace          = { version = "0.20.0", features = ["panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["log-04"] }
esp-hal                = { version = "~1.2.2", features = ["log-04", "unstable"] }
esp-println            = { version = "0.18.0", features = ["log-04"] }
esp-radio              = { version = "1.0.0-beta.1", optional = true, features = ["esp-alloc", "log-04", "unstable"] }
esp-rtos               = { version = "0.4.0", features = ["embassy", "esp-alloc", "log-04"] }

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time     = { version = "0.5.1", features = ["log"] }
embedded-hal     = "1.0.0"
embedded-io-async = "0.7.0"
embedded-hal-bus = { version = "0.3.0", optional = true }
embedded-sdmmc   = { version = "0.10.0", optional = true, default-features = false }
sdio             = { version = "0.5.3", optional = true }
log              = "0.4.27"

[features]
## Always use the USB-Serial-JTAG console. Without it the examples use it only
## when a USB host is attached to the chip's own USB port, and UART0 otherwise.
usb-serial-jtag = []
## SD card examples over SPI (any chip).
sdcard = ["esp-hal-provisioning/sdcard", "dep:embedded-sdmmc", "dep:embedded-hal-bus"]
## SD card examples on the SDMMC host (esp32, esp32s3, esp32p4).
sdmmc = ["esp-hal-provisioning/sdcard", "dep:sdio"]
## Wi-Fi provisioning examples.
wifi = ["esp-hal-provisioning/wifi", "dep:esp-radio", "esp-radio?/wifi", "esp-rtos/esp-radio"]
## BLE provisioning examples.
ble = ["esp-hal-provisioning/esp-ble", "dep:esp-radio", "esp-radio?/ble", "esp-rtos/esp-radio"]
## Wi-Fi + BLE together (Wi-Fi provisioning over BLE).
coex = ["wifi", "ble", "esp-hal-provisioning/coex", "esp-radio?/coex"]

esp32   = ["esp-hal-provisioning/esp32",   "esp-hal/esp32",   "esp-rtos/esp32",   "esp-backtrace/esp32",   "esp-println/esp32",   "esp-bootloader-esp-idf/esp32",   "esp-alloc/esp32",   "esp-radio?/esp32"]
esp32c2 = ["esp-hal-provisioning/esp32c2", "esp-hal/esp32c2", "esp-rtos/esp32c2", "esp-backtrace/esp32c2", "esp-println/esp32c2", "esp-bootloader-esp-idf/esp32c2", "esp-alloc/esp32c2", "esp-radio?/esp32c2"]
esp32c3 = ["esp-hal-provisioning/esp32c3", "esp-hal/esp32c3", "esp-rtos/esp32c3", "esp-backtrace/esp32c3", "esp-println/esp32c3", "esp-bootloader-esp-idf/esp32c3", "esp-alloc/esp32c3", "esp-radio?/esp32c3"]
esp32c5 = ["esp-hal-provisioning/esp32c5", "esp-hal/esp32c5", "esp-rtos/esp32c5", "esp-backtrace/esp32c5", "esp-println/esp32c5", "esp-bootloader-esp-idf/esp32c5", "esp-alloc/esp32c5", "esp-radio?/esp32c5"]
esp32c6 = ["esp-hal-provisioning/esp32c6", "esp-hal/esp32c6", "esp-rtos/esp32c6", "esp-backtrace/esp32c6", "esp-println/esp32c6", "esp-bootloader-esp-idf/esp32c6", "esp-alloc/esp32c6", "esp-radio?/esp32c6"]
esp32c61= ["esp-hal-provisioning/esp32c61", "esp-hal/esp32c61", "esp-rtos/esp32c61", "esp-backtrace/esp32c61", "esp-println/esp32c61", "esp-bootloader-esp-idf/esp32c61", "esp-alloc/esp32c61", "esp-radio?/esp32c61"]
esp32h2 = ["esp-hal-provisioning/esp32h2", "esp-hal/esp32h2", "esp-rtos/esp32h2", "esp-backtrace/esp32h2", "esp-println/esp32h2", "esp-bootloader-esp-idf/esp32h2", "esp-alloc/esp32h2"]
esp32p4 = ["esp-hal-provisioning/esp32p4", "esp-hal/esp32p4", "esp-rtos/esp32p4", "esp-backtrace/esp32p4", "esp-println/esp32p4", "esp-bootloader-esp-idf/esp32p4", "esp-alloc/esp32p4"]
esp32s2 = ["esp-hal-provisioning/esp32s2", "esp-hal/esp32s2", "esp-rtos/esp32s2", "esp-backtrace/esp32s2", "esp-println/esp32s2", "esp-bootloader-esp-idf/esp32s2", "esp-alloc/esp32s2", "esp-radio?/esp32s2"]
esp32s3 = ["esp-hal-provisioning/esp32s3", "esp-hal/esp32s3", "esp-rtos/esp32s3", "esp-backtrace/esp32s3", "esp-println/esp32s3", "esp-bootloader-esp-idf/esp32s3", "esp-alloc/esp32s3", "esp-radio?/esp32s3"]
esp32s31= ["esp-hal-provisioning/esp32s31", "esp-hal/esp32s31", "esp-rtos/esp32s31", "esp-backtrace/esp32s31", "esp-println/esp32s31", "esp-bootloader-esp-idf/esp32s31", "esp-alloc/esp32s31", "esp-radio?/esp32s31"]

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"

# Built per chip/target, independent of the host workspace.
[workspace]
